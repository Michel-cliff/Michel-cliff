<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Un poste en automatisation ou management ? Parlons-en.">
<style>
.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.disp{font-family:'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes on{to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
@keyframes scanY{0%{transform:translateY(0)}50%{transform:translateY(34px)}100%{transform:translateY(0)}}
@keyframes grow{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes eye{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes glitch{0%,90%,100%{transform:none;opacity:1}91%{transform:translate(4px,0);opacity:.6}93%{transform:translate(-4px,1px)}95%{transform:translate(2px,-1px);opacity:.8}97%{transform:none}}
.rv{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
.px{opacity:0;animation:on .01s steps(1) forwards}
.cur{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}</style>
<rect width="1200" height="190" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="1199" height="189" fill="none" stroke="#D1D9E0"/>
<text class="mono" x="48" y="48" font-size="15" font-weight="700" fill="#C2380F" letter-spacing="1">// CONTACT</text>
<text class="disp" x="44" y="108" font-size="38" fill="#1F2328">UN POSTE EN AUTOMATISATION OU MANAGEMENT ?</text>
<text class="disp" x="44" y="158" font-size="38" fill="#C2380F">PARLONS-EN.</text>
<g style="animation:nudge 1.6s ease-in-out infinite"><text class="disp" x="310" y="158" font-size="38" fill="#946614">→</text></g>
<g transform="translate(1088,62)">
<line x1="32" y1="30" x2="32" y2="60" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="22" y1="60" x2="42" y2="60" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="32" cy="26" r="5" fill="#C2380F"/>
<path d="M22 16 A14 14 0 0 0 22 36 M42 16 A14 14 0 0 1 42 36" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" style="animation:pulse 1.4s infinite"/>
<path d="M14 8 A26 26 0 0 0 14 44 M50 8 A26 26 0 0 1 50 44" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" style="animation:pulse 1.4s .35s infinite"/></g>
</svg>
