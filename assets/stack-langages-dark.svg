<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-label="Langages Et Frameworks">
<style>
.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.disp{font-family:'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes on{to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
@keyframes scanY{0%{transform:translateY(0)}50%{transform:translateY(34px)}100%{transform:translateY(0)}}
@keyframes grow{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes eye{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes glitch{0%,90%,100%{transform:none;opacity:1}91%{transform:translate(4px,0);opacity:.6}93%{transform:translate(-4px,1px)}95%{transform:translate(2px,-1px);opacity:.8}97%{transform:none}}
.rv{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
.px{opacity:0;animation:on .01s steps(1) forwards}
.cur{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect width="560" height="210" fill="#0B0B0A"/>
<rect x=".5" y=".5" width="559" height="209" fill="none" stroke="#2A2A27"/>
<g transform="translate(468,22)"><rect x="4" y="10" width="56" height="44" rx="4" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="4" y1="20" x2="60" y2="20" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M14 30 L22 37 L14 44" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="27" y="41" width="12" height="4" fill="#E8461E" style="animation:blink 1s steps(1) infinite"/></g>
<text class="disp" x="26" y="72" font-size="26" fill="#FFFFFF">LANGAGES ET FRAMEWORKS</text>
<rect x="28" y="108" width="78" height="34" fill="#5B8CFF"/><text class="mono" x="39" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Python</text><rect x="114" y="108" width="116" height="34" fill="#5B8CFF"/><text class="mono" x="125" y="131" font-size="15" font-weight="700" fill="#0B0B0A">JavaScript</text><rect x="238" y="108" width="69" height="34" fill="#5B8CFF"/><text class="mono" x="249" y="131" font-size="15" font-weight="700" fill="#0B0B0A">React</text><rect x="315" y="108" width="88" height="34" fill="#5B8CFF"/><text class="mono" x="326" y="131" font-size="15" font-weight="700" fill="#0B0B0A">FastAPI</text><rect x="411" y="108" width="31" height="34" fill="#5B8CFF"/><text class="mono" x="422" y="131" font-size="15" font-weight="700" fill="#0B0B0A">C</text><rect x="450" y="108" width="40" height="34" fill="#5B8CFF"/><text class="mono" x="461" y="131" font-size="15" font-weight="700" fill="#0B0B0A">C#</text>
</svg>
