<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" role="img" aria-label="Pm Kinator">
<style>
.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.disp{font-family:'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes on{to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scanY{0%{transform:translateY(0)}50%{transform:translateY(34px)}100%{transform:translateY(0)}}
@keyframes grow{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes eye{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes glitch{0%,90%,100%{transform:none;opacity:1}91%{transform:translate(4px,0);opacity:.6}93%{transform:translate(-4px,1px)}95%{transform:translate(2px,-1px);opacity:.8}97%{transform:none}}
.rv{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
.px{opacity:0;animation:on .01s steps(1) forwards}
.cur{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect width="560" height="330" fill="#0B0B0A"/>
<rect x="1.0" y="1.0" width="558" height="328" fill="none" stroke="#D4A03A" stroke-width="2"/>
<text class="mono" x="28" y="44" font-size="14" font-weight="700" fill="#D4A03A">01 / 05</text>
<text class="mono" x="118" y="44" font-size="13" fill="#A3A19A">OPEN SOURCE →</text>
<g transform="translate(468,22)">
<line x1="32" y1="4" x2="32" y2="14" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="32" cy="5" r="3.5" fill="#E8461E" style="animation:pulse 1.2s infinite"/>
<rect x="10" y="14" width="44" height="34" rx="6" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g style="transform-origin:32px 29px;animation:eye 3s infinite"><rect x="19" y="24" width="8" height="8" fill="#D4A03A"/><rect x="37" y="24" width="8" height="8" fill="#D4A03A"/></g>
<line x1="20" y1="40" x2="44" y2="40" stroke="#D4A03A" stroke-width="2.5" stroke-dasharray="4 4" style="animation:flow 1s linear infinite"/>
<line x1="4" y1="26" x2="10" y2="26" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="54" y1="26" x2="60" y2="26" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<line x1="22" y1="48" x2="22" y2="58" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="42" y1="48" x2="42" y2="58" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<text class="disp" x="26" y="128" font-size="34" fill="#FFFFFF">PM KINATOR</text>
<text x="28" y="166" font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#FFFFFF">Skill Claude open source : assistant PM senior.</text>
<text x="28" y="192" font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#FFFFFF">Triage des mails, tickets priorisés en MoSCoW,</text>
<text x="28" y="218" font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#FFFFFF">risques roadmap, plan du matin.</text>
<rect x="28" y="274" width="71" height="28" fill="#D4A03A"/><text class="mono" x="39" y="293" font-size="13" font-weight="700" fill="#0B0B0A">Claude</text><rect x="107" y="274" width="46" height="28" fill="#D4A03A"/><text class="mono" x="118" y="293" font-size="13" font-weight="700" fill="#0B0B0A">MCP</text><rect x="161" y="274" width="71" height="28" fill="#E8461E"/><text class="mono" x="172" y="293" font-size="13" font-weight="700" fill="#0B0B0A">MoSCoW</text>
</svg>
