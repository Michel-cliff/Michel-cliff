<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="200" viewBox="0 0 1140 200" role="img" aria-label="Services data, BPCE IT">
<style>
.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.disp{font-family:'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes on{to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
@keyframes scanY{0%{transform:translateY(0)}50%{transform:translateY(34px)}100%{transform:translateY(0)}}
@keyframes grow{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes eye{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes glitch{0%,90%,100%{transform:none;opacity:1}91%{transform:translate(4px,0);opacity:.6}93%{transform:translate(-4px,1px)}95%{transform:translate(2px,-1px);opacity:.8}97%{transform:none}}
.rv{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
.px{opacity:0;animation:on .01s steps(1) forwards}
.cur{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect width="1140" height="200" fill="#0B0B0A"/>
<rect x=".5" y=".5" width="1139" height="199" fill="none" stroke="#2A2A27"/>
<text class="mono" x="28" y="44" font-size="14" font-weight="700" fill="#D4A03A">05 / 05</text>
<text class="mono" x="118" y="44" font-size="13" fill="#A3A19A">BPCE IT</text>
<g transform="translate(1048,22)">
<ellipse cx="32" cy="12" rx="22" ry="7" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M10 12 V50 A22 7 0 0 0 54 50 V12" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M10 25 A22 7 0 0 0 54 25" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".6"/><path d="M10 38 A22 7 0 0 0 54 38" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".6"/>
<line x1="32" y1="20" x2="32" y2="56" stroke="#E8461E" stroke-width="3" stroke-dasharray="3 9" style="animation:flow .8s linear infinite"/></g>
<text class="disp" x="26" y="100" font-size="34" fill="#FFFFFF">SERVICES DATA</text>
<text x="28" y="134" font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#FFFFFF">3 projets d'innovation livrés en 5 mois pour des directions métier.</text>
<rect x="28" y="150" width="71" height="28" fill="#5B8CFF"/><text class="mono" x="39" y="169" font-size="13" font-weight="700" fill="#0B0B0A">Python</text><rect x="107" y="150" width="79" height="28" fill="#5B8CFF"/><text class="mono" x="118" y="169" font-size="13" font-weight="700" fill="#0B0B0A">FastAPI</text><rect x="194" y="150" width="71" height="28" fill="#D4A03A"/><text class="mono" x="205" y="169" font-size="13" font-weight="700" fill="#0B0B0A">Docker</text><rect x="273" y="150" width="79" height="28" fill="#D4A03A"/><text class="mono" x="284" y="169" font-size="13" font-weight="700" fill="#0B0B0A">Jenkins</text><rect x="360" y="150" width="62" height="28" fill="#E8461E"/><text class="mono" x="371" y="169" font-size="13" font-weight="700" fill="#0B0B0A">Scrum</text>
</svg>
