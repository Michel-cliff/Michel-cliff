<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="210" viewBox="0 0 1140 210" role="img" aria-label="Outils">
<style>
.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.disp{font-family:'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes on{to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
@keyframes scanY{0%{transform:translateY(0)}50%{transform:translateY(34px)}100%{transform:translateY(0)}}
@keyframes grow{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes eye{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes glitch{0%,90%,100%{transform:none;opacity:1}91%{transform:translate(4px,0);opacity:.6}93%{transform:translate(-4px,1px)}95%{transform:translate(2px,-1px);opacity:.8}97%{transform:none}}
.rv{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
.px{opacity:0;animation:on .01s steps(1) forwards}
.cur{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect width="1140" height="210" fill="#0B0B0A"/>
<rect x=".5" y=".5" width="1139" height="209" fill="none" stroke="#2A2A27"/>
<g transform="translate(1048,22)"><g style="transform-origin:32px 32px;animation:spin 6s linear infinite"><rect x="28" y="2" width="8" height="12" rx="1" fill="#D4A03A" transform="rotate(0 32 32)"/><rect x="28" y="2" width="8" height="12" rx="1" fill="#D4A03A" transform="rotate(45 32 32)"/><rect x="28" y="2" width="8" height="12" rx="1" fill="#D4A03A" transform="rotate(90 32 32)"/><rect x="28" y="2" width="8" height="12" rx="1" fill="#D4A03A" transform="rotate(135 32 32)"/><rect x="28" y="2" width="8" height="12" rx="1" fill="#D4A03A" transform="rotate(180 32 32)"/><rect x="28" y="2" width="8" height="12" rx="1" fill="#D4A03A" transform="rotate(225 32 32)"/><rect x="28" y="2" width="8" height="12" rx="1" fill="#D4A03A" transform="rotate(270 32 32)"/><rect x="28" y="2" width="8" height="12" rx="1" fill="#D4A03A" transform="rotate(315 32 32)"/><circle cx="32" cy="32" r="19" stroke="#D4A03A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<circle cx="32" cy="32" r="7" fill="#E8461E" style="animation:pulse 1.4s infinite"/></g>
<text class="disp" x="26" y="72" font-size="30" fill="#FFFFFF">OUTILS</text>
<rect x="28" y="108" width="125" height="34" fill="#D4A03A"/><text class="mono" x="39" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Claude Code</text><rect x="161" y="108" width="50" height="34" fill="#D4A03A"/><text class="mono" x="172" y="131" font-size="15" font-weight="700" fill="#0B0B0A">MCP</text><rect x="219" y="108" width="59" height="34" fill="#D4A03A"/><text class="mono" x="230" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Jira</text><rect x="286" y="108" width="116" height="34" fill="#D4A03A"/><text class="mono" x="297" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Confluence</text><rect x="410" y="108" width="78" height="34" fill="#D4A03A"/><text class="mono" x="421" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Notion</text><rect x="496" y="108" width="69" height="34" fill="#D4A03A"/><text class="mono" x="507" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Asana</text><rect x="573" y="108" width="78" height="34" fill="#D4A03A"/><text class="mono" x="584" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Trello</text><rect x="659" y="108" width="59" height="34" fill="#D4A03A"/><text class="mono" x="670" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Miro</text><rect x="726" y="108" width="69" height="34" fill="#D4A03A"/><text class="mono" x="737" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Figma</text><rect x="803" y="108" width="50" height="34" fill="#D4A03A"/><text class="mono" x="814" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Git</text><rect x="861" y="108" width="78" height="34" fill="#D4A03A"/><text class="mono" x="872" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Docker</text><rect x="947" y="108" width="144" height="34" fill="#D4A03A"/><text class="mono" x="958" y="131" font-size="15" font-weight="700" fill="#0B0B0A">Elasticsearch</text><rect x="28" y="150" width="97" height="34" fill="#D4A03A"/><text class="mono" x="39" y="173" font-size="15" font-weight="700" fill="#0B0B0A">Supabase</text><rect x="133" y="150" width="50" height="34" fill="#D4A03A"/><text class="mono" x="144" y="173" font-size="15" font-weight="700" fill="#0B0B0A">GCP</text><rect x="191" y="150" width="50" height="34" fill="#D4A03A"/><text class="mono" x="202" y="173" font-size="15" font-weight="700" fill="#0B0B0A">AWS</text>
</svg>
