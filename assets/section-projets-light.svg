<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="84" viewBox="0 0 1140 84" role="img" aria-label="Projets">
<style>
.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.disp{font-family:'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes on{to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
@keyframes scanY{0%{transform:translateY(0)}50%{transform:translateY(34px)}100%{transform:translateY(0)}}
@keyframes grow{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes eye{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes glitch{0%,90%,100%{transform:none;opacity:1}91%{transform:translate(4px,0);opacity:.6}93%{transform:translate(-4px,1px)}95%{transform:translate(2px,-1px);opacity:.8}97%{transform:none}}
.rv{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
.px{opacity:0;animation:on .01s steps(1) forwards}
.cur{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect width="1140" height="84" fill="#FFFFFF"/>
<g transform="translate(6,10)"><rect x="12" y="12" width="40" height="40" rx="4" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="22" y1="4" x2="22" y2="12" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="22" y1="52" x2="22" y2="60" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="4" y1="22" x2="12" y2="22" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="52" y1="22" x2="60" y2="22" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="32" y1="4" x2="32" y2="12" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="32" y1="52" x2="32" y2="60" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="4" y1="32" x2="12" y2="32" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="52" y1="32" x2="60" y2="32" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="42" y1="4" x2="42" y2="12" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="42" y1="52" x2="42" y2="60" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="4" y1="42" x2="12" y2="42" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="52" y1="42" x2="60" y2="42" stroke="#946614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="22" y="22" width="20" height="20" fill="#946614" style="animation:pulse 1.6s infinite"/><circle cx="18" cy="18" r="2" fill="#C2380F" style="animation:blink 1s steps(1) infinite"/></g>
<text class="mono" x="96" y="56" font-size="28" font-weight="700" fill="#C2380F" letter-spacing="2">// PROJETS</text>
<line x1="300.5" y1="47" x2="1140" y2="47" stroke="#946614" stroke-width="2" stroke-dasharray="6 6" style="animation:flow 1.2s linear infinite"/>
</svg>
