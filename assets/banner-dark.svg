<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Hello I am Cliff ! Michel-Cliff Ogoudedji, ingénieur IA et automatisation, 3 ans d'expérience en dev et management de projet, disponible en CDI">
<style>
.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.disp{font-family:'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes on{to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
@keyframes scanY{0%{transform:translateY(0)}50%{transform:translateY(34px)}100%{transform:translateY(0)}}
@keyframes grow{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes eye{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes glitch{0%,90%,100%{transform:none;opacity:1}91%{transform:translate(4px,0);opacity:.6}93%{transform:translate(-4px,1px)}95%{transform:translate(2px,-1px);opacity:.8}97%{transform:none}}
.rv{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
.px{opacity:0;animation:on .01s steps(1) forwards}
.cur{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-1500px)}}.mq{animation:mq 30s linear infinite}.gl{animation:glitch 4s steps(1) 3s infinite}</style>
<rect width="1200" height="470" fill="#0B0B0A"/>

<g class="mono" font-size="17" fill="#A3A19A">
<g class="rv" style="animation-delay:.1s"><text x="48" y="56">&gt; dev + management de projet ..........</text><text x="490" y="56" fill="#E8461E" font-weight="700">3 ans d'expérience</text></g>
<g class="rv" style="animation-delay:.45s"><text x="48" y="84">&gt; statut ...........................</text><text x="490" y="84" fill="#E8461E" font-weight="700">disponible en CDI</text></g>
</g>
<g class="rv" style="animation-delay:.9s"><text class="disp" x="44" y="190" font-size="86" fill="#FFFFFF" letter-spacing="-2">Hello,</text></g>
<g class="rv" style="animation-delay:1.3s"><text class="disp" x="44" y="284" font-size="86" fill="#FFFFFF" letter-spacing="-2">I am <tspan class="gl" fill="#D4A03A">Cliff</tspan> <tspan fill="#E8461E">!</tspan></text></g>
<g class="rv" style="animation-delay:2.3s"><text class="mono" x="48" y="334" font-size="21" fill="#D4A03A" letter-spacing="1">// MICHEL-CLIFF OGOUDEDJI · INGÉNIEUR IA &amp; AUTOMATISATION<tspan class="cur" dx="8">█</tspan></text></g>
<g class="rv" style="animation-delay:2.6s">
<rect x="840" y="122" width="312" height="150" fill="#FFFFFF"/>
<text class="disp" x="866" y="232" font-size="104" fill="#0B0B0A">3</text>
<text class="mono" x="946" y="186" font-size="15" font-weight="700" fill="#0B0B0A">ANS D'EXPÉRIENCE</text>
<text class="mono" x="946" y="210" font-size="15" font-weight="700" fill="#0B0B0A">DEV + MANAGEMENT</text>
<text class="mono" x="946" y="234" font-size="15" font-weight="700" fill="#0B0B0A">DE PROJET</text>
<rect x="840" y="122" width="312" height="3" fill="#5B8CFF"><animate attributeName="y" values="122;269;122" dur="3s" repeatCount="indefinite"/></rect>
</g>
<g class="rv" style="animation-delay:2.9s">
<rect x="0" y="372" width="1200" height="58" fill="#D4A03A"/>
<g class="mq">
<text class="disp" x="0" y="410" font-size="24" fill="#0B0B0A" textLength="1500" lengthAdjust="spacingAndGlyphs">AGENTS IA + AUTOMATISATION + VISION PRODUIT + PYTHON + CLAUDE + MCP + GESTION DE PROJET + EPITECH × ISC PARIS + </text>
<text class="disp" x="1500" y="410" font-size="24" fill="#0B0B0A" textLength="1500" lengthAdjust="spacingAndGlyphs">AGENTS IA + AUTOMATISATION + VISION PRODUIT + PYTHON + CLAUDE + MCP + GESTION DE PROJET + EPITECH × ISC PARIS + </text>
</g></g>
<text class="mono rv" style="animation-delay:3.1s" x="48" y="455" font-size="13" fill="#A3A19A">Paris · Île-de-France · Epitech × ISC Paris</text>
</svg>
